# Adds namespace to all resources.
namespace: deptrack-operator-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: deptrack-operator-

# Labels to add to all resources and selectors.
#labels:
#- includeSelectors: true
#  pairs:
#    someName: someValue

resources:
- ../crd
- ../rbac
- ../manager
# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix including the one in
# crd/kustomization.yaml
- ../webhook
# [CERTMANAGER] Webhook serving TLS: self-signed Issuer + Certificate published
# into the webhook-server-cert Secret consumed by the manager Deployment and
# the ValidatingWebhookConfiguration caBundle (wired via replacements below).
- ../certmanager
# [CERTMANAGER] To enable cert-manager, uncomment all sections with 'CERTMANAGER'. 'WEBHOOK' components are required.
#- ../certmanager
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
#- ../prometheus
# [METRICS] Expose the controller manager metrics service.
- metrics_service.yaml
# [NETWORK POLICY] Protect the /metrics endpoint and Webhook Server with NetworkPolicy.
# Only Pod(s) running a namespace labeled with 'metrics: enabled' will be able to gather the metrics.
# Only CR(s) which requires webhooks and are applied on namespaces labeled with 'webhooks: enabled' will
# be able to communicate with the Webhook Server.
#- ../network-policy

# Uncomment the patches line if you enable Metrics
patches:
# [METRICS] The following patch will enable the metrics endpoint using HTTPS and the port :8443.
# More info: https://book.kubebuilder.io/reference/metrics
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment

# [WEBHOOK] Mount the Team validating webhook serving cert into the manager
# Deployment so the webhook server can serve TLS on :9443 (MEM023). Kept as an
# independent patch so the webhook resources themselves stay opt-in.
- path: webhook_server_cert_mount_patch.yaml
  target:
    kind: Deployment

# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix including the one in
# crd/kustomization.yaml
- path: manager_webhook_patch.yaml
  target:
    kind: Deployment

# [WEBHOOK] Kustomize does not rewrite service references inside admission
# webhook configurations when namePrefix or namespace transforms the Service.
# Source both fields from the final webhook Service metadata so every generated
# distribution points the API server at the Service it actually creates.
#
# [CERTMANAGER] Delegate ValidatingWebhookConfiguration.caBundle population to
# cert-manager's cainjector by annotating it with the serving Secret that the
# Certificate (above) publishes. Sources namespace + secretName from the
# Certificate so the built manifest agrees with the volume the manager mounts
# (webhook-server-cert) and the Helm chart's inject-ca-from annotation.
replacements:
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: metadata.name
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - webhooks.0.clientConfig.service.name
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - webhooks.0.clientConfig.service.namespace
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: webhook-server-cert
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 0
          create: true
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: webhook-server-cert
      fieldPath: metadata.name
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 1
          create: true

