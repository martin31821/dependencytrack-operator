---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: teams.dependencytrack.mko.dev
spec:
  group: dependencytrack.mko.dev
  names:
    kind: Team
    listKind: TeamList
    plural: teams
    singular: team
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.uuid
      name: UUID
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Team is the Schema for the teams API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TeamSpec defines the desired state of Team.
            properties:
              name:
                description: Name of the team to create.
                type: string
              oidc:
                description: |-
                  OIDC configures OpenID Connect group mapping for this team. It is a
                  pointer so that a nil value is distinguishable from an empty Groups
                  slice; the controller treats nil as "OIDC management disabled" and
                  therefore skips all OIDC API calls (see T04).
                  Minimum-cardinality / membership validation is deliberately deferred to
                  the admission webhook (see T02) rather than encoded as a CRD enum, so
                  that arbitrary upstream group-name casing is accepted verbatim.
                properties:
                  groups:
                    description: |-
                      Groups is the list of OIDC group names to map to this team. Entries
                      are compared verbatim against upstream Identity Provider claims: casing
                      is intentionally preserved (no normalization happens in the API types)
                      so operators retain full control over matching semantics.
                    items:
                      type: string
                    type: array
                type: object
              permissions:
                description: |-
                  Permissions is an ordered list of permission names to assign to this team.
                  Valid permission names include: PORTFOLIO_MANAGEMENT,
                  VIEW_VULNERABILITY, VULNERABILITY_ANALYSIS, BOM_UPLOAD, PROJECT_CREATION,
                  PROJECT_CREATION_UPLOAD, SYSTEM_CONFIGURATION, ACCESS_MANAGEMENT,
                  VIEW_PORTFOLIO, PROJECT_READ, VULNERABILITY_ASSESSMENT, and others
                  specific to the DependencyTrack version in use.
                  Omit to leave existing permissions unchanged; pass an empty array to
                  clear all permissions.
                items:
                  type: string
                type: array
            type: object
          status:
            description: TeamStatus defines the observed state of Team.
            properties:
              conditions:
                description: Conditions reflect the current reconciliation state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              name:
                description: Name records the name that was last synced to DependencyTrack.
                type: string
              oidc:
                description: |-
                  OIDC reflects the observed OIDC-to-team mapping state. A nil pointer
                  means the controller has not yet reconciled OIDC for this team;
                  an empty OwnedMappings slice confirms that no mappings exist.
                properties:
                  ownedMappings:
                    description: |-
                      OwnedMappings enumerates the OIDC-to-team mappings currently owned by
                      this team in DependencyTrack.
                    items:
                      description: OwnedOIDCMapping describes a single OIDC-to-Team
                        mapping owned by a Team.
                      properties:
                        groupName:
                          description: |-
                            GroupName is the OIDC group name as delivered by the Identity Provider.
                            Stored verbatim, case-unaltered.
                          type: string
                        groupUuid:
                          description: GroupUUID is the DependencyTrack UUID of the
                            OIDC group.
                          type: string
                        mappingUuid:
                          description: MappingUUID is the DependencyTrack UUID of
                            the OIDC group->team mapping.
                          type: string
                        teamUuid:
                          description: TeamUUID is the DependencyTrack UUID of the
                            owning team.
                          type: string
                      type: object
                    type: array
                type: object
              permissions:
                description: |-
                  Permissions tracks the permissions last synced to DependencyTrack.
                  This is used for status-only observability; the controller reconciles
                  the actual permission set each reconciliation cycle.
                type: string
              uuid:
                description: UUID is the actual UUID of the team in dependencytrack.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
