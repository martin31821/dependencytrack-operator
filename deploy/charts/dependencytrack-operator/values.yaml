controllerManager:
  manager:
    args:
    - --metrics-bind-address=:8443
    - --leader-elect
    - --health-probe-bind-address=:8081
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    env:
      deptrackCredentialsSecret: deptrack-credentials
      deptrackUrl: http://localhost:8081
    image:
      repository: controller
      tag: latest
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
  nodeSelector: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  replicas: 1
  tolerations: []
  topologySpreadConstraints: []
kubernetesClusterDomain: cluster.local
metricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  type: ClusterIP
serviceAccount:
  annotations: {}
  automount: true
  create: true
  name: ""

# Webhook TLS certificate (base64-encoded, no newlines).
# Generate with hack/generate-webhook-certs.sh and pass at install time:
#   helm install --set webhookCert.tlsCrt=$(base64 -w0 certs/tls.crt) --set webhookCert.tlsKey=$(base64 -w0 certs/tls.key) ...
# For production, use cert-manager instead.
webhookCert:
  tlsCrt: ""
  tlsKey: ""
  caBundle: ""
