{{- /* Self-signed serving certificate for the Team validating webhook.

     NOTE: This is a DEV/E2E-only certificate (long TTL, shared keypair).
     Production deployments should mint the serving cert via cert-manager
     or a kubebuilder certgen init-job instead. The PEM is sourced from
     certs/webhook.pem so the Secret and the ValidatingWebhookConfiguration
     share a single source of truth. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dependencytrack-operator.fullname" . }}-webhook-server-cert
  labels:
    control-plane: controller-manager
  {{- include "dependencytrack-operator.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Files.Get "certs/webhook.pem" | b64enc }}
  tls.key: {{ .Files.Get "certs/webhook.key" | b64enc }}
