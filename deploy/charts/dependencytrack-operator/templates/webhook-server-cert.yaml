{{- /* Webhook serving certificate for the Team validating webhook.

     The certificate is provided via Helm values (webhookCert.tlsCrt and
     webhookCert.tlsKey). Generate it with hack/generate-webhook-certs.sh
     and pass the values at install time, or use cert-manager in production.
     */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dependencytrack-operator.fullname" . }}-webhook-server-cert
  labels:
    control-plane: controller-manager
  {{- include "dependencytrack-operator.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- if .Values.webhookCert.tlsCrt }}
  tls.crt: {{ .Values.webhookCert.tlsCrt }}
  tls.key: {{ .Values.webhookCert.tlsKey }}
  {{- else }}
  {{- fail "webhookCert.tlsCrt and webhookCert.tlsKey must be set. Run hack/generate-webhook-certs.sh and pass the values." }}
  {{- end }}