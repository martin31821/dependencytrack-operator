apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "dependencytrack-operator.fullname" . }}-validator
  labels:
    control-plane: controller-manager
  {{- include "dependencytrack-operator.labels" . | nindent 4 }}
webhooks:
  - name: vteam.dependencytrack.mko.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    rules:
      - apiGroups: ["dependencytrack.mko.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["teams"]
        scope: "*"
    clientConfig:
      service:
        name: {{ include "dependencytrack-operator.fullname" . }}-controller-manager-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-dependencytrack-mko-dev-v1alpha1-team
        port: 9443
      {{- if .Values.webhookCert.caBundle }}
      caBundle: {{ .Values.webhookCert.caBundle }}
      {{- else }}
      {{- fail "webhookCert.caBundle must be set. Run hack/generate-webhook-certs.sh and pass the value." }}
      {{- end }}